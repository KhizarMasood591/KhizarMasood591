<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% block title %}
    <title>Log In</title>
    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
    <link rel="icon" href="{{url_for('static', filename='RSG Logo.svg')}}" type="img">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="{{url_for('static',filename='frontend.js')}}"></script>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <div class="background">
        </div>
        <div class="content">
          <img src="{{url_for('static', filename='RSG-Hospitality-white-bg.svg')}}" alt="Logo" width="200" height="150">
          <h1>Offer Letter Generator</h1>
          {% block content %}
          <div class="login">
            <h2>Sign In</h2>
            <form method="post", action="{{url_for('login_page')}}">
              <div class="row mb-3">
                <label for="Email" class="col-sm-3 col-form-label">Email</label>
                <div class="col-sm-3">
                  <input type="text" name="email">
                </div>
              </div>
              <div class="row mb-3">
                <label for="password" class="col-sm-3 col-form-label">Password</label>
                <div class="col-sm-3">
                  <input type="password" name="password">
                </div>
              </div>
              <div class="col align-self-center">
                <button class="col-sm-10 btn btn-primary" onclick="show_alert()">Log In</button>
              </div>
            </form>
          </div>
          {% endblock %}
        </div>
      </div>
    </main>
  </body>
</html>
